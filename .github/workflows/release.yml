# Builds Rat-Man as a desktop app for macOS and Windows (Java bundled inside, nothing else to install)
# and publishes them on the GitHub Releases page.
#
# To publish a new version (either way works):
#   - On GitHub: Actions tab -> "Build apps" -> "Run workflow", type a version like 1.1.0, click Run.
#   - Or from a terminal:  git tag v1.1.0 && git push origin v1.1.0
# Run it with the version box empty to just build the apps (they appear as downloads on that run).
# Only the parts of Java the game uses (desktop + logging) are bundled, keeping each app ~34 MB.
name: Build apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 (leave empty to just build, no release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            label: mac
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the game jar
        run: mvn -B package

      - name: Work out the version number
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          if [[ -z "$V" ]]; then V="${GITHUB_REF_NAME#v}"; fi
          V="${V#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then V="1.0.0"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Gather the app files
        shell: bash
        run: |
          mkdir -p staging/natives
          cp target/rat-man.jar staging/
          cp target/lib/*.jar staging/
          cp target/natives/* staging/natives/ || true
          ls -R staging

      - name: Package for macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          jpackage --type dmg \
            --name Rat-Man \
            --app-version "$APP_VERSION" \
            --vendor "Rat-Man Team" \
            --description "Rat-Man: a Pac-Man-style maze game" \
            --input staging \
            --main-jar rat-man.jar \
            --main-class ratman.RatMan \
            --icon packaging/ratman.icns \
            --mac-package-identifier io.github.damonsea.ratman \
            --add-modules java.desktop,java.logging \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=zip-6" \
            --java-options '-Dnet.java.games.input.librarypath=$APPDIR/natives' \
            --dest dist
          mv dist/*.dmg "dist/Rat-Man-$APP_VERSION-mac.dmg"

      - name: Package for Windows (.zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage --type app-image \
            --name Rat-Man \
            --app-version "$APP_VERSION" \
            --vendor "Rat-Man Team" \
            --description "Rat-Man: a Pac-Man-style maze game" \
            --input staging \
            --main-jar rat-man.jar \
            --main-class ratman.RatMan \
            --icon packaging/ratman.ico \
            --add-modules java.desktop,java.logging \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=zip-6" \
            --java-options '-Dnet.java.games.input.librarypath=$APPDIR/natives' \
            --dest dist
          cd dist
          7z a "Rat-Man-$APP_VERSION-windows.zip" Rat-Man

      - uses: actions/upload-artifact@v4
        with:
          name: rat-man-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            V="${{ github.event.inputs.version }}"
            TAG="v${V#v}"
          fi
          ls -la dist
          # creates the tag on this commit if it doesn't exist yet
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Rat-Man $TAG" \
            --notes-file packaging/RELEASE_NOTES.md
